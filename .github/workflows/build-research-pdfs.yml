name: Build Turkish and English research PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF converter
        run: npm install --no-save md-to-pdf
      - name: Generate PDFs from research notes
        run: |
          mkdir -p docs
          npx md-to-pdf RESEARCH_NOTE_TR.md
          npx md-to-pdf RESEARCH_NOTE_EN.md
          mv RESEARCH_NOTE_TR.pdf docs/Protein_Surveillance_Model_TR_v0.3.pdf
          mv RESEARCH_NOTE_EN.pdf docs/Protein_Surveillance_Model_EN_v0.3.pdf
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Generate Turkish and English v0.3 research PDFs"
            git push
          fi
